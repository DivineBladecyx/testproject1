name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall and Ninja
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          choco install ninja

      # 自动从官方镜像静默安装 Qt 6.8.0 及其全部拓展组件
      - name: Install Qt 6.8.0
        run: |
          python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --outputdir C:\Qt -m qtwebsockets qtquick3d qtquicktimeline

      # 激活 MSVC 命令行开发环境
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # 使用 Ninja + MSVC 进行配置与隔离构建
      - name: Configure CMake
        shell: cmd
        run: |
          set "PATH=C:\Qt\6.8.0\msvc2022_64\bin;%PATH%"
          cmake -B build_win -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/6.8.0/msvc2022_64"

      - name: Build SIMM Executable
        shell: cmd
        run: |
          cmake --build build_win --config Release --target SIMM --parallel

      - name: Collect Release Package (windeployqt)
        shell: cmd
        run: |
          mkdir SIMM_Windows_x64
          mkdir SIMM_Windows_x64\config
          if exist build_win\Release\SIMM.exe (copy build_win\Release\SIMM.exe SIMM_Windows_x64\) else (copy build_win\SIMM.exe SIMM_Windows_x64\)
          if exist config\app_config.ini (copy config\app_config.ini SIMM_Windows_x64\config\)
          C:\Qt\6.8.0\msvc2022_64\bin\windeployqt.exe --qmldir . SIMM_Windows_x64\SIMM.exe

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: SIMM-Windows-x64
          path: SIMM_Windows_x64
          retention-days: 14
