[Middleware]
; 中间层 WebSocket 服务地址
;Url=ws://localhost:8765/tcs
Url=ws://127.0.0.1:8081/tcs
;Url=ws://10.10.177.116:8081/tcs
AutoConnect=true
ReconnectInterval=5000
Timeout=30000
[Startup]
InitializationCompleteCommand=
InitializationFailedCommand=
AllowAnonymousSnapshotQuery=false

[Treatment]
; Required for login. Set this workstation's actual room ID before use.
RoomId=ROOM_1

[Gateway]
; 网关服务器地址
Url=https://gateway.simm.com

; WebSocket设置
WebSocketPath=/ws
Timeout=30000
HeartbeatInterval=30000

[Auth]
; 认证设置
TokenExpiryBuffer=300  ; Token过期前多少秒刷新
AutoReconnect=true
MaxReconnectAttempts=5

[Application]
; 应用设置
Name=SIMM TCS
AutoLogin=false
RememberGateway=true

[Logout]
ProtocolEnabled=true
TimeoutMs=15000
BeamStatusMaxAgeMs=5000
[Logging]
; 日志设置
Level=INFO
GatewayLogLevel=DEBUG
LogToFile=true
LogPath=./logs/simm_tcs.log
